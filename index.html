<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" type="text/css" href="mystyle.css">
  <meta charset="utf-8">
  <title>Hare</title>
</head>
<body>
  <h1 style="margin-top: 40px;margin-bottom: 20px"><q>蜉蝣之羽，衣裳楚楚。</q></h1>
  <p>逸，弱冠。</p>
  <p>左眼有一泪痣，常散发。</p>
  <p>性平和，略显沉默。喜饮茶、赏乐。</p>
  <p>藏有木制环首刀。</p>
</body>
</html>
